# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# BN: added stage to install uvr binary
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Install uvr (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nbafrank/uvr/releases/latest \
            | grep '"tag_name"' \
            | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')

          case "${{ runner.os }}" in
            Linux) ASSET="uvr-x86_64-unknown-linux-musl.tar.gz" ;;
            macOS) ASSET="uvr-aarch64-apple-darwin.tar.gz" ;;
          esac

          UVR_TMP=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o "${UVR_TMP}/${ASSET}" \
            "https://github.com/nbafrank/uvr/releases/download/${VERSION}/${ASSET}"

          tar -xzf "${UVR_TMP}/${ASSET}" -C "${UVR_TMP}"
          chmod +x "${UVR_TMP}/uvr"
          sudo mv "${UVR_TMP}/uvr" /usr/local/bin/uvr

      - name: Install uvr (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
            "https://api.github.com/repos/nbafrank/uvr/releases/latest").tag_name

          $asset = "uvr-x86_64-pc-windows-msvc.zip"
          $tmp = New-TemporaryFile | ForEach-Object { Remove-Item $_; New-Item -ItemType Directory -Path "$_.dir" }
          $zipPath = Join-Path $tmp $asset

          Invoke-WebRequest `
            -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" } `
            -Uri "https://github.com/nbafrank/uvr/releases/download/$version/$asset" `
            -OutFile $zipPath

          Expand-Archive -Path $zipPath -DestinationPath $tmp
          $installDir = "$env:LOCALAPPDATA\uvr"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Move-Item (Join-Path $tmp "uvr.exe") (Join-Path $installDir "uvr.exe")
          echo $installDir >> $env:GITHUB_PATH

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
