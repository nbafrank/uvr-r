# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# BN: added stage to install uvr binary
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Install uvr
        shell: bash
        run: |
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nbafrank/uvr/releases/latest \
            | grep '"tag_name"' \
            | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')

          OS="${{ runner.os }}"
          case "$OS" in
            Linux)   ASSET="uvr-x86_64-unknown-linux-musl.tar.gz" ;;
            macOS)   ASSET="uvr-aarch64-apple-darwin.tar.gz" ;;
            Windows) ASSET="uvr-x86_64-pc-windows-msvc.zip" ;;
          esac

          TMPDIR=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o "$TMPDIR/${ASSET}" \
            "https://github.com/nbafrank/uvr/releases/download/${VERSION}/${ASSET}"

          case "$OS" in
            Linux|macOS)
              tar -xzf "${ASSET}" -C "$TMPDIR"
              chmod +x uvr
              sudo mv uvr /usr/local/bin/uvr
              ;;
            Windows)
              unzip "${ASSET}" -d "$TMPDIR"
              mkdir -p "$LOCALAPPDATA/uvr"
              mv uvr.exe "$LOCALAPPDATA/uvr/uvr.exe"
              echo "$LOCALAPPDATA/uvr" >> "$GITHUB_PATH"
              ;;
          esac

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
